services:
  storage:
    image: redis
    volumes:
      - ./data:/data
  counter:
    image: node:24.18.0
    working_dir: /app
    volumes:
      - ./counter-service:/app
    environment:
      - PORT=3001
      - REDIS_URL=redis://storage
    ports:
      - 3001:3001
    command: npm run devц
    depends_on:
      - storage
  library:
    image: node:24.18.0
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PORT=3000
      - COUNTER_SERVICE_URL=http://counter:3001
    ports:
      - 80:3000
    command: npm run dev
    depends_on:
      - counter
