services:
  storage:
    image: redis
    volumes:
      - ./data:/data
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: mongoexpressuser
      ME_CONFIG_BASICAUTH_PASSWORD: mongoexpresspass
  counter:
    image: vladislavshipovkoi/library:counter
    environment:
      - PORT=3001
      - REDIS_URL=redis://storage
    ports:
      - 3001:3001
    depends_on:
      - storage
  library:
    image: vladislavshipovkoi/library:v1.0.0
    environment:
      - PORT=3000
      - COUNTER_SERVICE_URL=http://counter:3001
      - DB_URL=mongodb://root:example@mongo:27017
    ports:
      - 80:3000
    depends_on:
      - counter
